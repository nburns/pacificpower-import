[project]
name = "pacificpower-import"
version = "0.1.0"
description = "Pull Pacific Power Green Button data into Home Assistant long-term statistics."
readme = "README.md"
authors = [
    { name = "Nick Burns", email = "nick@burns.io" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "croniter>=2",
    "playwright>=1.47",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
pacificpower-import = "pacificpower_import.__main__:main"

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"
